<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog — Garasi Cepek</title>
  <meta name="description" content="Kami menyediakan beragam pilihan ban, velg, dop, aksesoris, dan perlengkapan mobil dengan pilihan produk yang beragam dan harga bersahabat.">
  <meta property="og:title" content="Katalog — Garasi Cepek">
  <meta property="og:description" content="Kami menyediakan beragam pilihan ban, velg, dop, aksesoris, dan perlengkapan mobil dengan pilihan produk yang beragam dan harga bersahabat.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <header class="bg-ink text-white sticky top-0 z-50 shadow-lg">
  <div class="max-w-7xl mx-auto px-5 py-2 flex justify-between items-center flex-col sm:flex-row gap-3 sm:gap-0">
    <div class="px-5 py-2 flex items-center flex-row gap-3" >
       <a href="/"><img class="-my-5" src="/img/garasicepek_48x48.png"></img></a>
       <a href="/" class="text-xl font-bold">Garasi<span class="text-brand">Cepek</span></a>
    </div>
    <nav class="flex gap-6 text-sm">
      
      
        
          <a href="/" class="text-gray-300 hover:text-brand transition-colors">Home</a>
        
      
        
          <a href="/katalog/" class="text-brand font-semibold">Katalog</a>
        
      
        
          <a href="/tentang/" class="text-gray-300 hover:text-brand transition-colors">Tentang</a>
        
      
        
          <a href="/kontak/" class="text-gray-300 hover:text-brand transition-colors">Kontak</a>
        
      
    </nav>
  </div>
</header>

  <main>
    
<section class="py-12">
  <div class="max-w-7xl mx-auto px-5">
    <h1 class="text-3xl font-bold text-center mb-8">Katalog Produk</h1>

    <!-- Filter bar -->
    <div class="bg-white p-5 rounded-xl shadow-sm mb-8 flex flex-wrap gap-3">
      <input type="text" id="filter-cari" placeholder="Cari produk..."
        class="flex-1 min-w-[200px] px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">

      <select id="filter-kategori" class="px-4 py-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-brand">
        <option value="">Semua Kategori</option>
      </select>

      <select id="filter-merek" class="px-4 py-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-brand">
        <option value="">Semua Merek</option>
      </select>

      <select id="filter-ukuran" class="px-4 py-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-brand">
        <option value="">Semua Ukuran</option>
        <option value="15">Ring 15</option>
        <option value="16">Ring 16</option>
        <option value="17">Ring 17</option>
        <option value="18">Ring 18</option>
        <option value="19">Ring 19</option>
        <option value="20">Ring 20</option>
      </select>
    </div>

    <!-- Grid produk -->
    <div id="grid-produk"
         class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>

    <!-- Tombol muat lebih banyak -->
    <div class="text-center mt-8">
      <button id="muat-lagi"
        class="hidden bg-brand text-white font-semibold px-7 py-3 rounded-lg hover:bg-brand-dark transition-colors">
        Muat Lebih Banyak
      </button>
    </div>
  </div>
</section>


<script src="/js/katalog.js"></script>


  </main>
  <footer class="bg-ink text-gray-400 py-10 text-center text-sm mt-16">
  <div class="max-w-7xl mx-auto px-5">
    <p>© 2026 Garasi Cepek. Semua hak dilindungi.</p>
    <p class="mt-2 space-x-2">
      <a href="/katalog/" class="text-brand hover:underline">Katalog</a>
      <span>·</span>
      <a href="/kontak/" class="text-brand hover:underline">Kontak</a>
    </p>
  </div>
</footer>

  
</body>
</html>
